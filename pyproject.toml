[project]
name = "ds-download"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jake Rosenberg", email = "jrosenberg@tacc.utexas.edu" }
]
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.162.7",
    "gunicorn>=27.0.1",
    "ipython>=9.18.1",
    "paramiko>=5.1.0",
    "pickleshare>=0.7.5",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "zipfly>=6.0.5",
]

[tool.uv]
package = false


[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
