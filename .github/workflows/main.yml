name: CI

# Controls when the action will run. Triggers the workflow on pushes to main or on pull request events
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  Server_Side_Unit_Tests:
    runs-on: ubuntu-24.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.13.5
          python-version: "3.13"
          enable-cache: true

      - name: Install Python packages
        run: uv sync --locked --all-groups

      - name: Run Server-side unit tests and generate coverage report
        run: |
          uv run pytest server

      - name: Run Server-side unit tests and generate coverage report
        run: |
          uv run pytest server

      - name: Run Server-side linting
        run: |
          uv run ruff check

      - name: Run Server-side format check
        run: |
          uv run ruff format --check server
